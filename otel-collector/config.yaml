receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check: { }
service:
  pipelines:
    profiles:
      receivers: [ otlp ]
      exporters: [ debug, otlp ]
    traces:
      receivers: [ otlp ]
      exporters: [ debug, otlp ]
    metrics:
      receivers: [ otlp ]
      exporters: [ debug, otlp ]
