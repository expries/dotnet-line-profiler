receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
exporters:
  debug:
    verbosity: detailed
  otlphttp:
    endpoint: http://profiles-api:8080/api
    encoding: proto
    tls:
      insecure: true
  otlp/pyroscope:
    endpoint: http://pyroscope:4040
    tls:
      insecure: true

extensions:
  health_check: { }
service:
  pipelines:
    profiles:
      receivers: [ otlp ]
      exporters: [ debug, otlp/pyroscope, otlphttp ]
    traces:
      receivers: [ otlp ]
      exporters: [ debug, otlphttp ]
    metrics:
      receivers: [ otlp ]
      exporters: [ debug, otlphttp ]
