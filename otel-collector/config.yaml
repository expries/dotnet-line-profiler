receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
exporters:
  debug:
    verbosity: detailed
  otlphttp:
    endpoint: http://processing-api:9080/api
    encoding: proto
    tls:
      insecure: true

extensions:
  health_check: { }
service:
  pipelines:
    profiles:
      receivers: [ otlp ]
      exporters: [ debug, otlphttp ]
    traces:
      receivers: [ otlp ]
      exporters: [ otlphttp ]
    metrics:
      receivers: [ otlp ]
      exporters: [ debug, otlphttp ]
