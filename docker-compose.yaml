services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: "--config /etc/otel-collector-config.yaml --feature-gates=service.profilesSupport"
    environment:
      OTEL_EXPORTER_OTLP_METRICS_COMPRESSION: false
    ports:
      - 4317:4317   # otlp grpc
      - 4318:4318   # otlp http
      - 13133:13133 # health_check extension
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector-config.yaml/:ro

  init:
    image: &tempoImage grafana/tempo:latest
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - ./tempo-data:/var/tempo

  tempo:
    image: *tempoImage
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/config.yaml:/etc/tempo.yaml
      - ./tempo/data:/var/tempo
    ports:
      - 3200:3200 # tempo
      - 5317:4317 # otlp grpc
    depends_on:
      - init

  grafana:
    image: grafana/grafana-enterprise
    ports:
      - 3000:3000
    volumes:
      - ./grafana/data:/var/lib/grafana/:rw

  app:
    platform: linux/amd64
    environment:
      ASPNETCORE_URLS: http://*:5000
      CORECLR_ENABLE_PROFILING: 1
      CORECLR_PROFILER_PATH: /opt/dotnet-profiler/LineProfiler.so
      CORECLR_PROFILER_PATH_64: /opt/dotnet-profiler/LineProfiler.so
    ports:
      - 5000:5000
    build:
      context: ./example-app
    volumes:
      - ./profiler/Release/linux-x64/:/opt/dotnet-profiler/
    depends_on:
      - otel-collector
