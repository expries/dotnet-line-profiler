services:
  app:
    platform: linux/amd64
    environment:
      ASPNETCORE_URLS: http://*:8080
      CORECLR_ENABLE_PROFILING: 1
      CORECLR_PROFILER_PATH: /opt/dotnet-profiler/LineProfiler.so
      CORECLR_PROFILER_PATH_64: /opt/dotnet-profiler/LineProfiler.so
    ports:
      - 8080:8080
    build:
      context: ./example-app
    volumes:
      - ./profiler/Release/linux-x64/:/opt/dotnet-profiler/
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: "--config /etc/otel-collector-config.yaml --feature-gates=service.profilesSupport"
    environment:
      OTEL_EXPORTER_OTLP_METRICS_COMPRESSION: false
    ports:
      - 4317:4317   # otlp grpc
      - 4318:4318   # otlp http
      - 13133:13133 # health_check extension
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector-config.yaml/:ro

  processing-api:
    environment:
      ASPNETCORE_URLS: http://*:9080
      ConnectionStrings__Database: "Host=processing-api-db:5432;Database=${POSTGRES_DB:?Set POSTGRES_DB};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - 9080:9080
    build:
      context: ./processing-api
    depends_on:
      - processing-api-db

  processing-api-db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - 5432:5432

  grafana:
    image: grafana/grafana-enterprise
    ports:
      - 3000:3000
    volumes:
      - ./grafana/data:/var/lib/grafana/:rw
